[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hf-model-explorer-mcp"
version = "0.1.0"
description = "MCP server for searching, comparing, and hardware-sizing Hugging Face models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["mcp", "model-context-protocol", "huggingface", "ai", "ml", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=2.0.0",
    "huggingface_hub>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/Greekkgod/MCP-Inspector"
Repository = "https://github.com/Greekkgod/MCP-Inspector"
Issues = "https://github.com/Greekkgod/MCP-Inspector/issues"

[project.scripts]
hf-model-explorer-mcp = "hf_model_explorer_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hf_model_explorer_mcp"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
